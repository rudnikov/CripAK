[project]
name = "cripak"
version = "0.1.0"
description = "Приложение для шифрования Word/Excel/JPG файлов"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    "PyQt6>=6.6,<7",
    "cryptography>=42",
    "keyring>=25",
]

[project.scripts]
crypt-app = "crypt_app.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "pytest-qt>=4.5.0",
    "pytest-xdist>=3.8.0",
]
